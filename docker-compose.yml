services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading_bot_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    environment:
      - TRADING_MODE=PAPER
      - TRADING_ENABLED=false
      - LIVE_TRADING=false
      - STARTING_CAPITAL=50.0
      - DATABASE_URL=sqlite+aiosqlite:///./data/trading_bot.db
      - API_HOST=0.0.0.0
      - API_PORT=8000
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trading_bot_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
